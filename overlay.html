<div id="text"></div>

<script>
async function update(){
    const text = await fetch(
        'https://docs.google.com/document/d/1uz1Jl9OFZJ1Euq6wMbLd7V4o1ZTGiIpLokvcRdm4Qm4/export?format=txt'
    ).then(r=>r.text());

    document.getElementById('text').innerText = text;
}

update();
setInterval(update, 2000);
</script>
